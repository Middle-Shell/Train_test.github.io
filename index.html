<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>WebRoom | Interactive Experience</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="bg-glow-1"></div>
    <div id="bg-glow-2"></div>
    
    <div id="unity-container" class="unity-desktop">
      <div id="unity-canvas-wrapper">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        
        <div id="unity-loading-bar">
          <div id="loading-header">
            <span id="loading-title">SYSTEM LOAD</span>
            <span id="unity-progress-text">0%</span>
          </div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
          <div id="loading-status">INITIALIZING SYSTEM...</div>
        </div>
      </div>
      
      <div id="unity-warning"> </div>
      
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-build-title">WebRoom</div>
        <div id="unity-fullscreen-button" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </div>
      </div>
    </div>
    
    <!-- VVARP Studio Footer -->
    <div id="vvarp-footer">
      <div class="vvarp-logo-container">
        <svg class="vvarp-logo-svg" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="60" y="34" fill="white" font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" letter-spacing="4">VVARP</text>
          <defs>
            <linearGradient id="logo-grad" x1="15" y1="12" x2="43" y2="38" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00f0ff" />
              <stop offset="1" stop-color="#ff007f" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="vvarp-contacts">
        <a href="mailto:info@vvarp.art" class="contact-item">
          <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span>info@vvarp.art</span>
        </a>
        <a href="https://t.me/madmsk" target="_blank" rel="noopener noreferrer" class="contact-item">
          <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.19 2.5a2.42 2.42 0 0 0-1.58-.2L3 8.35a1.22 1.22 0 0 0-.1 2.26l6 3.09 3.09 6a1.22 1.22 0 0 0 2.25-.1l6.05-16.61a2.42 2.42 0 0 0-.1-2.2z"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          <span>@madmsk</span>
        </a>
        <a href="tel:+79081520375" class="contact-item">
          <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span>+7 908 152 0375</span>
        </a>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #ff0055; padding: 12px; color: #fff; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); border-radius: 4px; font-family: Outfit, sans-serif;';
        else {
          if (type == 'warning') div.style = 'background: #ffaa00; padding: 12px; color: #000; box-shadow: 0 0 15px rgba(255, 170, 0, 0.4); border-radius: 4px; font-family: Outfit, sans-serif;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Train_test.github.io.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Train_test.github.io.data.unityweb",
        frameworkUrl: buildUrl + "/Train_test.github.io.framework.js.unityweb",
        codeUrl: buildUrl + "/Train_test.github.io.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WebRoom",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        document.body.classList.add("mobile-body");
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percentage = Math.round(100 * progress);
          document.querySelector("#unity-progress-bar-full").style.width = percentage + "%";
          var progressText = document.querySelector("#unity-progress-text");
          if (progressText) progressText.textContent = percentage + "%";
          
          var statusText = document.querySelector("#loading-status");
          if (statusText) {
            if (percentage < 30) {
              statusText.textContent = "INITIALIZING CORE SYSTEM...";
            } else if (percentage < 70) {
              statusText.textContent = "LOADING GRAPHICAL ASSETS...";
            } else if (percentage < 90) {
              statusText.textContent = "COMPILING SHADERS...";
            } else {
              statusText.textContent = "STARTING INTERACTIVE EXPERIENCE...";
            }
          }
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
